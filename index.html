<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trival Group - Control de Producción</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #FFFFFF; -webkit-tap-highlight-color: transparent; }
        .btn-primary { background-color: #4A30C4; color: white; min-height: 52px; border-radius: 10px; font-weight: 600; transition: all 0.2s; }
        .btn-primary:active { opacity: 0.8; transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .accent-gold { background-color: #F5B800; }
        .text-trival { color: #1A1A1A; }
        #reader { position: relative; width: 100%; height: 100%; background: #000; }
        #qr-video { width: 100%; height: 100%; object-fit: cover; display: block; }
        #qr-canvas { display: none; }
        .hidden { display: none !important; }
        /* Logo: ancho máximo controlado, alto automático para conservar proporciones */
        .logo-img {
            max-width: 180px;
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }
        .logo-img-sm {
            max-width: 120px;
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body class="overflow-x-hidden">

    <!-- SCREEN 1: LOGIN -->
    <div id="screen-login" class="min-h-screen flex flex-col items-center justify-center p-6 bg-white">
        <div class="w-full max-w-sm flex flex-col items-center">
            <img id="logo-login" class="logo-img mb-8" alt="Trival Group">
            <h1 class="text-2xl font-bold text-trival mb-8">Control de Producción</h1>
            <div class="w-full space-y-4">
                <label class="block text-sm font-medium text-gray-700">¿Quién eres?</label>
                <select id="inspector-select" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl text-lg focus:ring-2 focus:ring-[#4A30C4] outline-none">
                    <option value="">Cargando inspectores...</option>
                </select>
                <button onclick="handleLogin()" class="w-full btn-primary mt-4 flex items-center justify-center text-lg shadow-lg shadow-purple-500/20">
                    Ingresar
                </button>
            </div>
            <button onclick="switchScreen('admin-login')" class="mt-12 text-gray-400 text-sm hover:text-gray-600 transition-colors">
                Acceso Administrador
            </button>
        </div>
    </div>

    <!-- SCREEN 2: SCAN & REGISTER -->
    <div id="screen-scanner" class="min-h-screen hidden flex flex-col bg-white">
        <header class="bg-white px-4 py-3 flex items-center justify-between sticky top-0 z-50 shadow-sm border-b border-gray-100">
            <div id="current-inspector-name" class="text-xs font-semibold text-gray-500 truncate max-w-[110px]">Inspector</div>
            <div class="flex items-center space-x-1">
                <span class="text-xs text-gray-400">Registros:</span>
                <span id="record-counter" class="text-xs font-bold text-[#4A30C4]">0</span>
            </div>
            <button onclick="logout()" class="text-xs font-bold text-red-500 py-1 px-3 border border-red-100 rounded-full">Salir</button>
        </header>

        <div class="flex-1 flex flex-col overflow-y-auto">
            <div id="scanner-container" class="relative bg-black" style="min-height: 55vh;">
                <div id="reader" class="w-full h-full">
                <video id="qr-video" autoplay playsinline muted></video>
                <canvas id="qr-canvas"></canvas>
                </div>
                <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                    <div class="w-64 h-64 border-2 border-[#F5B800] rounded-2xl opacity-60 relative">
                        <div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-[#F5B800] -mt-1 -ml-1 rounded-tl"></div>
                        <div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-[#F5B800] -mt-1 -mr-1 rounded-tr"></div>
                        <div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-[#F5B800] -mb-1 -ml-1 rounded-bl"></div>
                        <div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-[#F5B800] -mb-1 -mr-1 rounded-br"></div>
                    </div>
                </div>
                <div id="scanner-placeholder" class="absolute inset-0 bg-gray-900 flex flex-col items-center justify-center p-8 text-center hidden">
                    <p class="text-white font-medium mb-4">Escaneo pausado</p>
                    <button onclick="restartScanner()" class="rounded-full bg-[#4A30C4] p-4 text-white hover:bg-[#3a22a0]">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    </button>
                    <p class="text-gray-400 text-xs mt-3">Toca para escanear otro</p>
                </div>
            </div>

            <div class="p-5 space-y-4 bg-white -mt-4 rounded-t-3xl relative z-10">
                <div id="status-message" class="hidden p-4 rounded-xl text-center text-sm font-semibold"></div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] uppercase tracking-wider font-bold text-gray-400 block mb-1">Doc. Origen</label>
                        <input type="text" id="qr-doc" readonly class="w-full bg-gray-50 p-3 rounded-lg border border-gray-100 text-sm font-medium text-gray-900 outline-none" placeholder="-">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase tracking-wider font-bold text-gray-400 block mb-1">Referencia</label>
                        <input type="text" id="qr-ref" readonly class="w-full bg-gray-50 p-3 rounded-lg border border-gray-100 text-sm font-medium text-gray-900 outline-none" placeholder="-">
                    </div>
                    <div class="col-span-2">
                        <label class="text-[10px] uppercase tracking-wider font-bold text-gray-400 block mb-1">Producto</label>
                        <input type="text" id="qr-product" readonly class="w-full bg-gray-50 p-3 rounded-lg border border-gray-100 text-sm font-medium text-gray-900 outline-none" placeholder="-">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] uppercase tracking-wider font-bold text-gray-400 block mb-1">Operario que fabricó *</label>
                    <select id="operator-select" class="w-full p-4 bg-white border border-gray-200 rounded-xl text-base focus:ring-2 focus:ring-[#4A30C4] outline-none">
                        <option value="">Seleccionar operario...</option>
                    </select>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[10px] uppercase tracking-wider font-bold text-gray-400">Observaciones</label>
                        <span id="char-count" class="text-[10px] text-gray-300">0/200</span>
                    </div>
                    <textarea id="observations" maxlength="200" rows="2" class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-[#4A30C4] outline-none" placeholder="Opcional..."></textarea>
                </div>
                <div class="flex items-center justify-between py-2 border-t border-gray-100">
                    <span id="display-date" class="text-xs text-gray-400 font-mono">--/--/----</span>
                    <span id="display-time" class="text-xs text-gray-400 font-mono">--:--:--</span>
                </div>
                <button id="save-btn" onclick="saveRecord()" class="w-full btn-primary flex items-center justify-center text-lg h-14 shadow-lg shadow-purple-500/20">
                    Guardar Registro
                </button>
            </div>
        </div>
    </div>

    <!-- SCREEN 3: ADMIN LOGIN -->
    <div id="screen-admin-login" class="min-h-screen hidden flex flex-col items-center justify-center p-6 bg-white">
        <div class="w-full max-w-sm flex flex-col items-center">
            <img id="logo-admin-login" class="logo-img mb-8" alt="Trival Group">
            <h1 class="text-xl font-bold text-trival mb-8">Panel de Administración</h1>
            <div class="w-full space-y-4">
                <input type="password" id="admin-pass" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl text-lg focus:ring-2 focus:ring-[#4A30C4] outline-none" placeholder="Contraseña" onkeydown="if(event.key==='Enter')handleAdminLogin()">
                <button onclick="handleAdminLogin()" class="w-full btn-primary">Entrar</button>
                <div id="admin-login-error" class="text-red-500 text-sm text-center hidden">Contraseña incorrecta. Intenta de nuevo.</div>
                <button onclick="switchScreen('login')" class="w-full text-gray-400 text-sm mt-2">← Volver</button>
            </div>
        </div>
    </div>

    <!-- SCREEN 4: ADMIN PANEL -->
    <div id="screen-admin-panel" class="min-h-screen hidden flex flex-col bg-gray-50">
        <header class="bg-white px-6 py-4 flex items-center justify-between border-b border-gray-100">
            <img id="logo-admin-panel" class="logo-img-sm" alt="Trival Group">
            <button onclick="logout()" class="text-xs font-bold text-[#4A30C4]">Cerrar sesión</button>
        </header>
        <div class="p-5 space-y-5 flex-1 overflow-y-auto">
            <div class="bg-purple-50 p-4 rounded-2xl border border-purple-100 flex items-center space-x-4">
                <div class="w-10 h-10 rounded-full bg-[#4A30C4] flex items-center justify-center text-white font-bold text-sm">CZ</div>
                <div>
                    <h2 class="text-sm font-bold text-gray-800">Hola, Carlos Zapata</h2>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wide font-semibold">Administrador General</p>
                </div>
            </div>
            <!-- INSPECTORES -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center space-x-2 mb-4 pb-3 border-b border-gray-50">
                    <div class="w-2 h-5 bg-[#4A30C4] rounded-full"></div>
                    <h3 class="text-sm font-bold text-gray-900">Inspectores</h3>
                </div>
                <div class="flex space-x-2 mb-4">
                    <input type="text" id="new-inspector" class="flex-1 bg-gray-50 p-3 rounded-xl text-sm outline-none focus:ring-2 focus:ring-purple-200 border border-gray-100" placeholder="Nombre completo">
                    <button onclick="addInspector()" class="bg-[#4A30C4] text-white px-4 rounded-xl font-bold text-sm">+ Agregar</button>
                </div>
                <ul id="inspectors-admin-list" class="divide-y divide-gray-50"></ul>
            </div>
            <!-- OPERARIOS -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center space-x-2 mb-4 pb-3 border-b border-gray-50">
                    <div class="w-2 h-5 bg-[#F5B800] rounded-full"></div>
                    <h3 class="text-sm font-bold text-gray-900">Operarios</h3>
                </div>
                <div class="flex space-x-2 mb-4">
                    <input type="text" id="new-operator" class="flex-1 bg-gray-50 p-3 rounded-xl text-sm outline-none focus:ring-2 focus:ring-purple-200 border border-gray-100" placeholder="Nombre completo">
                    <button onclick="addOperator()" class="bg-[#4A30C4] text-white px-4 rounded-xl font-bold text-sm">+ Agregar</button>
                </div>
                <ul id="operators-admin-list" class="divide-y divide-gray-50"></ul>
            </div>
        </div>
    </div>

        document.getElementById('logo-login').src = LOGO_SRC;
        document.getElementById('logo-admin-login').src = LOGO_SRC;
        document.getElementById('logo-admin-panel').src = LOGO_SRC;

        // --- STATE ---
        let currentInspector = "";
        let appConfig = { inspectors: [], operators: [] };
        let recordsToday = 0;
        // scanner managed via scanStream
        const SCREENS = ['login', 'scanner', 'admin-login', 'admin-panel'];

        // --- GAS API ---
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzYPB7AfjarKgeS9LozMcGsRaw30NTQB0fBceoR8-Fv9jP0Cu8FniivKJh3s_kRk3DB/exec";

        async function gasCall(action, payload={}) {
            const params = new URLSearchParams({ action, ...payload });
            const res = await fetch(GAS_URL + "?" + params.toString());
            return res.json();
        }

        async function gasPost(action, payload={}) {
            const res = await fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ action, data: JSON.stringify(payload) })
            });
            return res.json();
        }

        // --- INIT ---
        window.onload = () => { fetchInitialConfig(); updateDateTime(); setInterval(updateDateTime, 1000); };

        function fetchInitialConfig() {
            gasCall('getConfig').then(cfg => {
                appConfig = cfg; populateDropdowns(); populateAdminLists();
            }).catch(err => console.error("Config error:", err));
        }

        function populateDropdowns() {
            const iSel = document.getElementById('inspector-select');
            const oSel = document.getElementById('operator-select');
            iSel.innerHTML = '<option value="">Seleccionar inspector...</option>';
            appConfig.inspectors.filter(Boolean).forEach(i => { const o = document.createElement('option'); o.value=i; o.innerText=i; iSel.appendChild(o); });
            oSel.innerHTML = '<option value="">Seleccionar operario...</option>';
            appConfig.operators.filter(Boolean).forEach(o => { const opt = document.createElement('option'); opt.value=o; opt.innerText=o; oSel.appendChild(opt); });
        }

        // --- NAVIGATION ---
        function switchScreen(id) {
            SCREENS.forEach(s => document.getElementById('screen-'+s).classList.add('hidden'));
            document.getElementById('screen-'+id).classList.remove('hidden');
            if (id === 'scanner') startScanner(); else stopScanner();
        }

        function handleLogin() {
            const sel = document.getElementById('inspector-select');
            if (!sel.value) { sel.classList.add('border-red-400'); return; }
            sel.classList.remove('border-red-400');
            currentInspector = sel.value;
            document.getElementById('current-inspector-name').innerText = currentInspector;
            switchScreen('scanner');
        }

        function handleAdminLogin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'Trival@2026*') {
                document.getElementById('admin-login-error').classList.add('hidden');
                document.getElementById('admin-pass').value = '';
                switchScreen('admin-panel');
            } else {
                document.getElementById('admin-login-error').classList.remove('hidden');
            }
        }

        function logout() {
            currentInspector = ""; recordsToday = 0;
            document.getElementById('record-counter').innerText = '0';
            switchScreen('login');
        }

        // --- SCANNER (jsQR + getUserMedia nativo) ---
        let scanStream = null;
        let scanLoop = null;

        function startScanner() {
            stopScanner();
            setTimeout(initScanner, 300);
        }

        function initScanner() {
            const video = document.getElementById('qr-video');
            const constraints = {
                video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
            };
            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    scanStream = stream;
                    video.srcObject = stream;
                    video.play();
                    document.getElementById('scanner-placeholder').classList.add('hidden');
                    scanLoop = requestAnimationFrame(scanFrame);
                })
                .catch(err => {
                    console.error("Camera error:", err);
                    showStatus("No se pudo activar la cámara. Verifica los permisos en Chrome.", "bg-red-500 text-white");
                });
        }

        function scanFrame() {
            const video = document.getElementById('qr-video');
            const canvas = document.getElementById('qr-canvas');
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                if (code) { onScanSuccess(code.data); return; }
            }
            scanLoop = requestAnimationFrame(scanFrame);
        }

        function stopScanner() {
            if (scanLoop) { cancelAnimationFrame(scanLoop); scanLoop = null; }
            if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
            const video = document.getElementById('qr-video');
            if (video) video.srcObject = null;
        }
        function onScanSuccess(text) {
            if (navigator.vibrate) navigator.vibrate(150);
            const parts = text.split('|');
            if (parts.length < 3) { showStatus("QR no válido. Usa una etiqueta de Trival.", "bg-red-500 text-white"); return; }
            stopScanner().then(() => {
                document.getElementById('qr-doc').value = parts[0] || "-";
                document.getElementById('qr-ref').value = parts[1] || "-";
                document.getElementById('qr-product').value = parts[2] || "-";
                document.getElementById('scanner-placeholder').classList.remove('hidden');
            });
        }
        function restartScanner() {
            ['qr-doc','qr-ref','qr-product'].forEach(id => document.getElementById(id).value = "");
            document.getElementById('status-message').classList.add('hidden');
            startScanner();
        }

        // --- SAVE ---
        function saveRecord() {
            const data = {
                documento: document.getElementById('qr-doc').value,
                referencia: document.getElementById('qr-ref').value,
                producto: document.getElementById('qr-product').value,
                operario: document.getElementById('operator-select').value,
                inspector: currentInspector,
                observaciones: document.getElementById('observations').value
            };
            if (!data.documento || data.documento === "-") { showStatus("Primero escanea un código QR.", "bg-red-500 text-white"); return; }
            if (!data.operario) { document.getElementById('operator-select').classList.add('border-red-500'); showStatus("Selecciona el operario que fabricó.", "bg-red-500 text-white"); return; }
            document.getElementById('operator-select').classList.remove('border-red-500');
            const btn = document.getElementById('save-btn');
            btn.disabled = true; btn.innerText = "Guardando...";
            gasPost('saveRecord', data).then(res => {
                    btn.disabled = false; btn.innerText = "Guardar Registro";
                    if (res.success) {
                        recordsToday++;
                        document.getElementById('record-counter').innerText = recordsToday;
                        showStatus("✓ Registro guardado con éxito", "bg-green-500 text-white");
                        document.getElementById('observations').value = "";
                        document.getElementById('char-count').innerText = "0/200";
                        setTimeout(restartScanner, 2000);
                    } else { showStatus("Error al guardar. Verifica tu conexión.", "bg-red-500 text-white"); }
                }).catch(() => { btn.disabled = false; btn.innerText = "Guardar Registro"; showStatus("Error al guardar. Verifica tu conexión.", "bg-red-500 text-white"); });
        }

        function showStatus(msg, classes) {
            const el = document.getElementById('status-message');
            el.innerText = msg; el.className = "p-4 rounded-xl text-center text-sm font-semibold " + classes;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 4000);
        }

        // --- ADMIN ---
        function populateAdminLists() {
            document.getElementById('inspectors-admin-list').innerHTML = appConfig.inspectors.filter(Boolean).map(i => `
                <li class="flex items-center justify-between py-3">
                    <span class="text-sm text-gray-700">${i}</span>
                    <button onclick="removeInspector('${i}')" class="text-xs text-red-400 hover:text-red-600 border border-red-100 px-3 py-1 rounded-full">Eliminar</button>
                </li>`).join('');
            document.getElementById('operators-admin-list').innerHTML = appConfig.operators.filter(Boolean).map(o => `
                <li class="flex items-center justify-between py-3">
                    <span class="text-sm text-gray-700">${o}</span>
                    <button onclick="removeOperator('${o}')" class="text-xs text-red-400 hover:text-red-600 border border-red-100 px-3 py-1 rounded-full">Eliminar</button>
                </li>`).join('');
        }
        function addInspector() {
            const inp = document.getElementById('new-inspector'); const name = inp.value.trim(); if (!name) return;
            gasCall('addInspector', {name}).then(cfg => { appConfig=cfg; inp.value=''; populateAdminLists(); populateDropdowns(); });
        }
        function removeInspector(name) {
            if (!confirm(`¿Eliminar a ${name}?`)) return;
            gasCall('removeInspector', {name}).then(cfg => { appConfig=cfg; populateAdminLists(); populateDropdowns(); });
        }
        function addOperator() {
            const inp = document.getElementById('new-operator'); const name = inp.value.trim(); if (!name) return;
            gasCall('addOperator', {name}).then(cfg => { appConfig=cfg; inp.value=''; populateAdminLists(); populateDropdowns(); });
        }
        function removeOperator(name) {
            if (!confirm(`¿Eliminar a ${name}?`)) return;
            gasCall('removeOperator', {name}).then(cfg => { appConfig=cfg; populateAdminLists(); populateDropdowns(); });
        }

        // --- UTILS ---
        function updateDateTime() {
            const now = new Date();
            const opts = { timeZone: "America/Bogota", hour12: false };
            document.getElementById('display-date').innerText = now.toLocaleDateString('es-CO', {...opts, day:'2-digit', month:'2-digit', year:'numeric'});
            document.getElementById('display-time').innerText = now.toLocaleTimeString('es-CO', {...opts, hour:'2-digit', minute:'2-digit', second:'2-digit'});
        }
        document.getElementById('observations').addEventListener('input', function() {
            document.getElementById('char-count').innerText = this.value.length + "/200";
        });
    </script>
</body>
</html>
